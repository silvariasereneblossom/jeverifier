[project]
name = "jeverifier"
version = "0.2.0"
description = "JeVerifier: a Jev (TypeSafe) coding harness: task reading lists, session digests, and doc and code checks."
requires-python = ">=3.10"
dependencies = [
  "typesafe-sdk>=0.7.1",
  "keyring>=25",
  "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jeverifier = "jeverifier.cli:main"
jeverifier-mcp = "jeverifier.mcp_server:main"

[project.gui-scripts]
jeverifier-keys = "jeverifier.keys_gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jeverifier*"]

[tool.setuptools.package-data]
jeverifier = ["wiki_pages/*.md", "wiki_template/**/*.md"]
